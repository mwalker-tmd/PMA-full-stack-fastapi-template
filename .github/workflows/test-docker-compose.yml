name: Test Docker Compose

on:
  push:
    branches:
      - main
  pull_request:
permissions:
  contents: read

jobs:

  test-docker-compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Repository secrets and variables override the .env.example defaults when set
      - name: Create .env
        run: bash scripts/ci-env.sh
        env:
          PROJECT_NAME: ${{ vars.PROJECT_NAME }}
          FIRST_SUPERUSER: ${{ vars.FIRST_SUPERUSER }}
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          FIRST_SUPERUSER_PASSWORD: ${{ secrets.FIRST_SUPERUSER_PASSWORD }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      - run: docker compose build
      - run: docker compose down -v --remove-orphans
      - run: docker compose run --rm backend bash scripts/prestart.sh
      - run: docker compose up -d --wait backend adminer
      - name: Test backend is up
        run: curl http://localhost:8000/api/v1/utils/health-check
      - name: Test frontend is up
        run: curl http://localhost:8000
      - run: docker compose down -v --remove-orphans
